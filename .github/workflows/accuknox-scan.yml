name: AccuKnox ASPM Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AccuKnox Secret Scan
        if: github.event_name != 'pull_request'
        uses: accuknox/secret-scan-action@v1.0.6
        with:
          branch: "main"
          results: ""
          exclude_paths: ""
          additional_arguments: ""
          upload_results: true
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ vars.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ vars.ACCUKNOX_LABEL }}
          soft_fail: true
